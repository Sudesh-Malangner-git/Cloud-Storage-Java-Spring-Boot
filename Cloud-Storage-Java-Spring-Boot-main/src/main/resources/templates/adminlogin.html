<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/styles.css}">
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/bootstrap.min.css}">

    <title>Admin Login</title>
</head>

<body class="text-monospace text-uppercase">

<div class="container justify-content-center w-25 p-4" style="background-color: #eeeeee; margin-top: 5em;">

    <h1 class="display-5">Admin Login</h1>

    <!-- Admin Login Form -->
    <form action="#" th:action="@{/adminlogin}" method="POST">

        <div th:if="${error}" class="alert alert-danger">
            Invalid Admin Credentials
        </div>

        <div class="form-group">
            <label>Username</label>
            <label>
                <input type="text" class="form-control" name="username" placeholder="Enter Admin Username" required>
            </label>
        </div>

        <div class="form-group">
            <label>Password</label>
            <label>
                <input type="password" class="form-control" name="password" placeholder="Enter Admin Password" required>
            </label>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-primary">Admin Login</button>

        <a th:href="@{/login}" class="btn btn-secondary" style="margin-left: 10px;">
            Back to Login
        </a>

    </form>

</div>

</body>
</html>
